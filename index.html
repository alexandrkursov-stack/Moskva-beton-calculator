<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Калькулятор ипотеки — Москва Бетонная</title>
<style>
    body { 
        background: linear-gradient(135deg, #0f172a, #1e2937); 
        color: #e2e8f0; 
        font-family: system-ui, -apple-system, sans-serif; 
        padding: 20px; 
        max-width: 440px; 
        margin: 0 auto; 
        min-height: 100vh;
    }
    h2 { 
        text-align: center; 
        margin-bottom: 28px; 
        color: #f8fafc; 
        font-size: 24px;
    }
    label { 
        display: block; 
        margin: 20px 0 8px; 
        font-weight: 600; 
        color: #cbd5e1;
    }
    input { 
        width: 100%; 
        padding: 16px 18px; 
        background: #1e2937; 
        border: 1px solid #475569; 
        color: #f1f5f9; 
        border-radius: 14px; 
        font-size: 17px; 
        transition: all 0.3s;
    }
    input:focus { 
        border-color: #60a5fa; 
        outline: none; 
        box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.2);
    }
    .small { 
        font-size: 14.5px; 
        color: #94a3b8; 
        margin-top: 4px; 
    }
    .result { 
        background: #1e2937; 
        padding: 24px; 
        border-radius: 16px; 
        margin: 28px 0; 
        border-left: 5px solid #60a5fa;
    }
    .result p { 
        margin: 14px 0; 
        font-size: 18px; 
        font-weight: 500;
    }
    button { 
        width: 100%; 
        padding: 18px; 
        background: linear-gradient(90deg, #3b82f6, #60a5fa); 
        color: white; 
        border: none; 
        border-radius: 14px; 
        font-size: 17px; 
        font-weight: 600;
        margin-top: 10px;
        cursor: pointer;
        transition: 0.3s;
    }
    button:hover { background: linear-gradient(90deg, #2563eb, #3b82f6); }
</style>
</head>
<body>
<h2>Калькулятор ипотеки</h2>

<label>Стоимость объекта (₽)</label>
<input type="text" id="cost" value="15 000 000" oninput="formatLive(this); calcDownPercent(); calculate()">

<label>Первоначальный взнос (₽)</label>
<input type="text" id="down_rub" value="3 000 000" oninput="formatLive(this); calcDownPercent(); calculate()">

<div class="small" id="down_percent_display">20% от стоимости</div>

<label>Срок (лет)</label>
<input type="number" id="years" value="20" oninput="calculate()">

<label>Ставка (%)</label>
<input type="number" id="rate" value="15.5" step="0.1" oninput="calculate()">

<div class="result">
    <p><strong>Ежемесячный платёж:</strong> <span id="payment">—</span></p>
    <p><strong>Общая переплата:</strong> <span id="overpayment">—</span></p>
</div>

<button onclick="calculate()">Рассчитать</button>

<script>
function formatLive(input) {
    let raw = input.value.replace(/\s/g, '').replace(/[^0-9]/g, '');
    let formatted = raw.replace(/\B(?=(\d{3})+(?!\d))/g, " ");
    input.value = formatted;
}

function getRawValue(id) {
    return parseFloat(document.getElementById(id).value.replace(/\s/g, '')) || 0;
}

function calcDownPercent() {
    const cost = getRawValue('cost');
    const down = getRawValue('down_rub');
    if (cost > 0) {
        const percent = ((down / cost) * 100).toFixed(1);
        document.getElementById('down_percent_display').innerText = percent + '% от стоимости';
    }
}

function calculate() {
    const cost = getRawValue('cost');
    const down = getRawValue('down_rub');
    const years = parseFloat(document.getElementById('years').value) || 20;
    const rate = parseFloat(document.getElementById('rate').value) || 15.5;

    const loan = cost - down;
    if (loan <= 0) return;

    const monthlyRate = rate / 100 / 12;
    const months = years * 12;

    const payment = loan * (monthlyRate * Math.pow(1 + monthlyRate, months)) / (Math.pow(1 + monthlyRate, months) - 1);
    const total = payment * months;
    const over = total - loan;

    document.getElementById('payment').innerText = Math.round(payment).toLocaleString('ru-RU') + ' ₽';
    document.getElementById('overpayment').innerText = Math.round(over).toLocaleString('ru-RU') + ' ₽';
}

// Автообновление
document.getElementById('cost').addEventListener('input', calculate);
document.getElementById('down_rub').addEventListener('input', calculate);
document.getElementById('years').addEventListener('input', calculate);
document.getElementById('rate').addEventListener('input', calculate);
</script>
</body>
</html>
